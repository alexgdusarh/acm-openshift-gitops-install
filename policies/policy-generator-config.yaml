apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gitops-operator-prod
placementBindingDefaults:
  name: binding-gitops-operator-prod
policyDefaults:
  namespace: prod-apps
  placement:
    placementPath: placement-gitops-operator.yaml
  remediationAction: inform    # prod: report drift, promote to enforce deliberately
  severity: critical
  orderManifests: true
  consolidateManifests: false
  standards:
    - NIST-CSF
  categories:
    - PR.IP Information Protection Processes and Procedures
  controls:
    - PR.IP-1 Baseline Configuration
policies:
  - name: policy-gitops-operator-prod
    manifests:
      - path: manifests/namespace.yaml
      - path: manifests/operatorgroup.yaml
      - path: manifests/subscription.yaml
      - path: manifests/configmap-cluster-info.yaml
